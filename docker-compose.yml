services:
  postgres:
    image: postgres:16-alpine
    container_name: chayan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chayan
      POSTGRES_PASSWORD: chayan
      POSTGRES_DB: chayan
    ports:
      - "5432:5432"
    volumes:
      - chayan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chayan -d chayan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chayan-pgdata:
